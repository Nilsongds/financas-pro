name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build:android

      - name: Create Android project
        run: npx cap add android

      - name: Configure permanent app signature
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/financas-pro.p12
          cat >> android/app/build.gradle <<'EOF'
          android {
              signingConfigs {
                  stableRelease {
                      storeFile file("financas-pro.p12")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias "1"
                      keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      storeType "PKCS12"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.stableRelease
                  }
              }
          }
          EOF

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: cd android && ./gradlew assembleDebug

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Finanças Pro para Android
          files: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
